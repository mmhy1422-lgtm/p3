<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Kaza Mix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-amber-500 selection:text-zinc-950">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
        <video autoplay muted loop playsinline class="w-full h-full object-cover"><source src="pr.mp4" type="video/mp4"></video>
        <div class="absolute inset-0 bg-zinc-950/70 backdrop-blur-[2px]"></div>
    </div>

    <div class="relative z-10 glass-nav border border-white/10 shadow-2xl rounded-3xl max-w-md w-full p-8 space-y-5 mx-4">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-black bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 bg-clip-text text-transparent">إنشاء حساب</h1>
            <p class="text-zinc-400 text-xs">انضم إلى Kaza Mix وابدأ طلبك الآن</p>
        </div>

        <button type="button" onclick="continueWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white text-zinc-900 font-bold py-3 rounded-xl transition hover:bg-zinc-200 text-sm">
            <i class="fa-brands fa-google text-red-500"></i>
            التسجيل بجوجل
        </button>

        <div class="flex items-center gap-3 text-zinc-500 text-[11px]">
            <span class="h-px flex-1 bg-zinc-700"></span>
            <span>أو</span>
            <span class="h-px flex-1 bg-zinc-700"></span>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs text-zinc-400 font-semibold">الاسم الكامل</label>
                <input type="text" id="register-name" required placeholder="محمد علي" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-amber-500 transition">
            </div>

            <div class="space-y-1">
                <label class="text-xs text-zinc-400 font-semibold">البريد الإلكتروني</label>
                <input type="email" id="register-email" required placeholder="name@example.com" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-amber-500 transition">
            </div>

            <div class="space-y-1">
                <label class="text-xs text-zinc-400 font-semibold">كلمة المرور</label>
                <input type="password" id="register-password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3.5 rounded-xl cursor-pointer transition shadow-lg shadow-amber-500/20 text-sm">
                إنشاء الحساب ✅
            </button>
        </form>

        <p class="text-center text-xs text-zinc-400">
            عندك حساب بالفعل؟
            <a href="login.html" class="text-amber-400 font-bold hover:text-amber-300">تسجيل الدخول</a>
        </p>

        <div id="auth-status" class="hidden rounded-xl border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-200"></div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = '630733901982-i4j85d059qnqjjn1t7ifpv4jnrjjitc8.apps.googleusercontent.com';

        function showStatus(message, type = 'info') {
            const el = document.getElementById('auth-status');
            if (!el) return;
            el.textContent = message;
            el.classList.remove('hidden', 'border-amber-500/30', 'bg-amber-500/10', 'text-amber-200', 'border-red-500/30', 'bg-red-500/10', 'text-red-200', 'border-emerald-500/30', 'bg-emerald-500/10', 'text-emerald-200');

            if (type === 'error') {
                el.classList.add('border-red-500/30', 'bg-red-500/10', 'text-red-200');
            } else if (type === 'success') {
                el.classList.add('border-emerald-500/30', 'bg-emerald-500/10', 'text-emerald-200');
            } else {
                el.classList.add('border-amber-500/30', 'bg-amber-500/10', 'text-amber-200');
            }
            el.classList.remove('hidden');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value.trim();

            if (!name || !email || !password) {
                showStatus('من فضلك أكمل جميع الحقول', 'error');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    showStatus(data.message || 'حدث خطأ أثناء إنشاء الحساب', 'error');
                    return;
                }

                showStatus('تم إنشاء الحساب بنجاح، جارٍ التوجيه إلى تسجيل الدخول...', 'success');
                setTimeout(() => window.location.href = 'login.html', 800);
            } catch (error) {
                console.error(error);
                showStatus('تعذر الاتصال بالخادم، حاول مرة أخرى', 'error');
            }
        }

        async function continueWithGoogle() {
            if (!window.google || !window.google.accounts) {
                showStatus('جارٍ تفعيل تسجيل الدخول بجوجل...', 'info');
                return;
            }

            showStatus('جارٍ فتح حساب جوجل...', 'info');
            window.google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: async (response) => {
                    try {
                        const apiResponse = await fetch('/api/google-login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ credential: response.credential })
                        });

                        const data = await apiResponse.json();
                        if (!apiResponse.ok || !data.success) {
                            showStatus(data.message || 'فشل التسجيل بجوجل', 'error');
                            return;
                        }

                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('userEmail', data.user.email);
                        localStorage.setItem('userName', data.user.name || data.user.email);
                        localStorage.setItem('userRole', data.admin ? 'admin' : 'user');
                        localStorage.setItem('authToken', data.token);

                        showStatus('تم التسجيل بجوجل بنجاح', 'success');
                        setTimeout(() => window.location.href = 'index.html', 600);
                    } catch (error) {
                        console.error(error);
                        showStatus('تعذر إكمال التسجيل بجوجل', 'error');
                    }
                }
            });

            window.google.accounts.id.prompt();
        }
    </script>
</body>
</html>
