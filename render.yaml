services:
  - type: web
    name: kaza-mix
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/kaza-mix-data
      - key: ADMIN_EMAIL
        value: admin@burgercraft.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 630733901982-i4j85d059qnqjjn1t7ifpv4jnrjjitc8.apps.googleusercontent.com
